<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoot Dates – Availability</title>
<style>
:root{--bg:#f3f1ee;--ink:#1d1f24;--mut:#6b6f78;--line:#d9d6d1;--free:#e4efe6;--freeInk:#1f5a33;--busy:#1d1f24;--busyInk:#f3f1ee;--acc:#b3263e;--card:#fbfaf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5}
header{padding:28px 20px 8px;max-width:1100px;margin:auto}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:2rem;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--mut);margin:0}
.bar{max-width:1100px;margin:16px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.tabs button{border:0;background:transparent;padding:10px 18px;font:inherit;cursor:pointer;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--busyInk)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:4px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.nav{max-width:1100px;margin:14px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.nav strong{font-family:Georgia,serif;font-weight:400;font-size:1.1rem;min-width:200px;text-align:center}.jump{margin:0 0 0 auto;display:flex;gap:8px;align-items:center}.jump input{width:auto}
.legend{max-width:1100px;margin:14px auto 0;padding:0 20px;display:flex;gap:18px;color:var(--mut);font-size:.9rem}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
main{max-width:1100px;margin:16px auto 40px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.month{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.month h2{font-family:Georgia,serif;font-weight:400;font-size:1.3rem;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.month h2 small{font-family:"Segoe UI",sans-serif;font-size:.8rem;color:var(--freeInk)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dow{text-align:center;font-size:.72rem;color:var(--mut)}
.day{aspect-ratio:1;border:0;border-radius:4px;font:inherit;font-size:.9rem;cursor:pointer;background:var(--free);color:var(--freeInk);position:relative}
.day:hover{outline:2px solid var(--ink)}
.day.busy{background:var(--busy);color:var(--busyInk)}
.day.busy::after{content:"";position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.day.past{opacity:.4}
.empty{visibility:hidden}
dialog{border:1px solid var(--ink);border-radius:6px;padding:22px;max-width:360px;width:92%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-family:Georgia,serif;font-weight:400;margin:0 0 2px;font-size:1.25rem}
label{display:block;margin-top:12px;font-size:.88rem;color:var(--mut)}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.primary{background:var(--ink);color:var(--busyInk);border-color:var(--ink)}
.danger{color:var(--acc);border-color:var(--acc)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--busyInk);padding:10px 16px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Shoot dates</h1>
  <p class="sub">Tap a date to sign it for a client, or release it. Everything saves automatically in this browser.</p>
</header>

<div class="bar">
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="traditional" aria-selected="true">Traditional video</button>
    <button role="tab" data-t="semi" aria-selected="false">Semi-candid video</button>
  </div>
  <div class="tools">
    <button class="btn" id="copy">Copy available dates</button>
    <button class="btn" id="exp">Export backup</button>
    <button class="btn" id="imp">Import backup</button>
    <button class="btn" id="reset">Reset to original</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</div>
<div class="nav">
  <button class="btn" id="prev">‹ Earlier</button>
  <strong id="range"></strong>
  <button class="btn" id="next">Later ›</button>
  <label class="jump">Go to month <input type="month" id="jump"></label>
  <button class="btn" id="now">This month</button>
</div>
<div class="legend"><span><i style="background:var(--free)"></i>Available</span><span><i style="background:var(--busy)"></i>Booked</span></div>

<main id="months"></main>

<dialog id="dlg">
  <h3 id="dTitle"></h3>
  <div id="dState" class="sub"></div>
  <label>Client name<input id="dName" placeholder="e.g. Priya &amp; Raj"></label>
  <label>Note (venue, time, phone)<textarea id="dNote" rows="3"></textarea></label>
  <div class="row">
    <button class="btn" id="dCancel">Cancel</button>
    <button class="btn danger" id="dFree">Mark available</button>
    <button class="btn primary" id="dSave">Sign date</button>
  </div>
</dialog>
<div id="toast"></div>

<script>
const KEY="shootDates.v1";
const SPAN=4;
let view={y:2026,m:10};
function getMonths(){const a=[];for(let i=0;i<SPAN;i++){const d=new Date(view.y,view.m+i,1);a.push([d.getFullYear(),d.getMonth()])}return a}
function shift(n){const d=new Date(view.y,view.m+n,1);view={y:d.getFullYear(),m:d.getMonth()};render()}
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
// Original data: booked (❌) days per month
const DEFAULT_BOOKED={"2026-10":[25,30],"2026-11":[2,3,11,12,14],"2027-0":[19,24,25,26,27,28,31],"2027-1":[1,2,10,11,12,15,16]};
const pad=n=>String(n).padStart(2,"0");
const k=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;

function defaults(){
  const o={};
  for(const key in DEFAULT_BOOKED){const [y,m]=key.split("-").map(Number);
    DEFAULT_BOOKED[key].forEach(d=>o[k(y,m,d)]={name:"",note:""});}
  return {traditional:JSON.parse(JSON.stringify(o)),semi:JSON.parse(JSON.stringify(o)),tab:"traditional"};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.traditional||!S.semi){S=defaults();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save in this browser")}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}

const today=new Date();today.setHours(0,0,0,0);
const $=id=>document.getElementById(id);

function render(){
  const ms=getMonths(),f=ms[0],l=ms[ms.length-1];
  $("range").textContent=`${MN[f[1]]} ${f[0]} – ${MN[l[1]]} ${l[0]}`;
  $("jump").value=`${f[0]}-${pad(f[1]+1)}`;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===S.tab));
  const data=S[S.tab],root=$("months");root.innerHTML="";
  getMonths().forEach(([y,m])=>{
    const n=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();
    let free=0,html="";
    ["S","M","T","W","T","F","S"].forEach(d=>html+=`<div class="dow">${d}</div>`);
    for(let i=0;i<first;i++)html+='<div class="empty"></div>';
    for(let d=1;d<=n;d++){
      const key=k(y,m,d),busy=!!data[key],past=new Date(y,m,d)<today;
      if(!busy)free++;
      const tip=busy&&data[key].name?` title="${esc(data[key].name)}"`:"";
      html+=`<button class="day${busy?" busy":""}${past?" past":""}" data-k="${key}"${tip} aria-label="${d} ${MN[m]} ${busy?"booked":"available"}">${d}</button>`;
    }
    const c=document.createElement("section");c.className="month";
    c.innerHTML=`<h2>${MN[m]} ${y}<small>${free} available</small></h2><div class="grid">${html}</div>`;
    root.appendChild(c);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let cur=null;
$("months").addEventListener("click",e=>{
  const b=e.target.closest(".day");if(!b)return;
  cur=b.dataset.k;const [y,m,d]=cur.split("-").map(Number);
  const rec=S[S.tab][cur];
  $("dTitle").textContent=`${d} ${MN[m-1]} ${y}`;
  $("dState").textContent=(S.tab==="semi"?"Semi-candid video":"Traditional video")+" · "+(rec?"Booked":"Available");
  $("dName").value=rec?rec.name:"";$("dNote").value=rec?rec.note:"";
  $("dFree").style.display=rec?"":"none";
  $("dSave").textContent=rec?"Update":"Sign date";
  $("dlg").showModal();
});
$("dCancel").onclick=()=>$("dlg").close();
$("dSave").onclick=()=>{S[S.tab][cur]={name:$("dName").value.trim(),note:$("dNote").value.trim()};save();render();$("dlg").close();toast("Date signed")};
$("dFree").onclick=()=>{delete S[S.tab][cur];save();render();$("dlg").close();toast("Date released")};

$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.t;save();render()});

$("copy").onclick=()=>{
  const data=S[S.tab];
  let t="** AVAILABLE DATES **\n\n"+(S.tab==="semi"?"SEMI-CANDID VIDEO":"TRADITIONAL VIDEO")+"\n";
  getMonths().forEach(([y,m])=>{
    const n=new Date(y,m+1,0).getDate(),a=[];
    for(let d=1;d<=n;d++)a.push(data[k(y,m,d)]?"❌":d);
    t+=`\n*${MN[m].toUpperCase()}\n${a.join(", ")}\n`;
  });
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied. Paste it in WhatsApp"),()=>{prompt("Copy this text:",t)});
};
$("exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  a.download="shoot-dates-backup.json";a.click();toast("Backup downloaded");
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.traditional||!o.semi)throw 0;S=o;save();render();toast("Backup loaded")}catch(x){toast("That file is not a valid backup")}};
  r.readAsText(f);e.target.value="";
};
$("reset").onclick=()=>{if(confirm("Reset both calendars to the original dates? All signed names will be lost.")){S=defaults();save();render();toast("Reset done")}};

$("prev").onclick=()=>shift(-SPAN);
$("next").onclick=()=>shift(SPAN);
$("now").onclick=()=>{view={y:today.getFullYear(),m:today.getMonth()};render()};
$("jump").onchange=e=>{const v=e.target.value;if(!v)return;const [y,m]=v.split("-").map(Number);view={y,m:m-1};render()};
render();
</script>
</body>
</html>
